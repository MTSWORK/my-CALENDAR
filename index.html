<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 캘린더</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
  }
  iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }
</style>
</head>
<body>
<!--
  노션 임베드용 구글 캘린더 (읽기 전용, API 키 없음).
  공개(public) 상태인 구글 캘린더를 구글 캘린더 기본 임베드로 그대로 보여 줍니다.
  캘린더 ID는 평문 메일 주소가 소스에 남지 않도록 base64로 담았습니다.
  더 가벼운 FullCalendar UI + 공휴일 표시 버전은 fullcalendar.html 참고 (구글 API 키 필요).
-->
<iframe
  src="https://calendar.google.com/calendar/embed?src=bXRzd29ya3MyMDI0QGdtYWlsLmNvbQ&ctz=Asia%2FSeoul&mode=MONTH&showTitle=0&showNav=1&showDate=1&showPrint=0&showTabs=0&showCalendars=0&showTz=0&wkst=1&bgcolor=%23ffffff"
  title="내 캘린더"
  frameborder="0"
  scrolling="no"
  loading="lazy"
  referrerpolicy="no-referrer-when-downgrade"></iframe>
</body>
</html>
